# nginx interne de l'image « web » : sert le client et relaie Colyseus (HTTP de matchmaking + WebSocket)
# sous /ws/. Le préfixe est retiré avant d'atteindre le serveur.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Résolution à chaque requête (DNS interne de Docker) : le serveur est recréé à chaque déploiement.
    resolver 127.0.0.11 valid=10s;
    set $game_server http://server:2567;

    location /ws/ {
        rewrite ^/ws/(.*)$ /$1 break;
        proxy_pass $game_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Une partie dure plusieurs minutes : pas de coupure de la connexion WebSocket.
        proxy_read_timeout 1h;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
