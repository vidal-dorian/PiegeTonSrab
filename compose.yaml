# Déploiement sur le Raspberry Pi : docker compose up -d --build --wait
# En local (sans surcharge) : http://localhost:8081 ; le serveur de jeu est atteint via /ws.
name: piegetonsrab

services:
  web:
    build:
      context: .
      target: web
      args:
        VITE_SERVER_URL: ${VITE_SERVER_URL:-}
    image: piegetonsrab-web:latest
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8081}:80"

  server:
    build:
      context: .
      target: server
    image: piegetonsrab-server:latest
    restart: unless-stopped
    # Parties en mémoire : rien à persister.
